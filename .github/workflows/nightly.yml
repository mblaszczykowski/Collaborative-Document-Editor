name: Nightly — głębokie property testy i chaos

on:
  schedule:
    # 03:00 UTC. Ten przebieg istnieje po to, żeby SZUKAĆ nowych kontrprzykładów,
    # a nie potwierdzać stare: CI na PR-ach chodzi ze stałym seedem (determinizm),
    # tutaj seed jest losowy i prób jest 10× więcej. Znaleziony kontrprzykład
    # trafia do repo jako zwykły test regresyjny.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  thorough-property-tests:
    name: Property testy — losowy seed, 10 000 prób
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Głębokie property testy
        run: ./gradlew :crdt-core:test -Pjqwik.thorough

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: counterexamples
          path: crdt-core/build/reports/tests/

  chaos:
    name: Testy chaosu (CP8)
    runs-on: ubuntu-latest
    # Włączane w CP8 — na razie job istnieje, żeby struktura pipeline'u była widoczna
    # od początku, ale nie udaje, że coś sprawdza.
    if: false
    steps:
      - run: echo "Do włączenia w CP8"
