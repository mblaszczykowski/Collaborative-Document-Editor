name: Nightly — deep property tests and benchmarks

on:
  schedule:
    # 03:00 UTC. This run exists to SEARCH for new counterexamples rather than confirm old ones:
    # CI on pull requests runs with a fixed seed (determinism), while here there are 10× the
    # tries. A counterexample found overnight goes into the repository as an ordinary regression
    # test.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  thorough-property-tests:
    name: Property tests — 10 000 tries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Deep property tests
        run: ./mvnw -B -pl crdt-core -Pthorough test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: counterexamples
          path: crdt-core/target/surefire-reports/

  benchmarks:
    name: JMH benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Numbers from a GitHub runner exist to detect REGRESSIONS between runs, not to be quoted
      # in the README. The runner is shared and variable, so its results are not comparable
      # between days in any defensible way. The README's numbers come from one described machine
      # — see the Performance section.
      - name: JMH
        run: ./mvnw -B -pl crdt-core test-compile exec:exec@run-benchmarks

      - uses: actions/upload-artifact@v4
        with:
          name: jmh-result
          path: crdt-core/target/jmh-result.json

  simulation:
    name: Deterministic simulation — 20 000 seeds per scenario
    runs-on: ubuntu-latest
    # The pull-request run explores 200 seeds in under a second, which confirms known-good
    # behaviour. This one searches: 20 000 seeds per scenario, about a hundred times the
    # schedules, still without Docker because the simulation touches no infrastructure.
    #
    # Same division of labour as the property tests above — confirm on every change, search
    # overnight. The difference from the chaos job below is that anything found here comes with
    # a seed, so it converts into a permanent regression test instead of a note saying it once
    # went red.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw -B install -DskipTests

      - name: Simulation sweep
        run: >-
          ./mvnw -B -pl app test
          -Dtest=ClusterSimulationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dsimulation.seeds=20000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The report contains the failing seed and the full event history. That pair is the
          # entire deliverable: paste the seed into REGRESSION_SEEDS and the interleaving
          # replays exactly, on any machine.
          name: simulation-counterexamples
          path: app/target/surefire-reports/

  chaos:
    name: Cluster chaos — 10 consecutive runs
    runs-on: ubuntu-latest
    # ClusterChaosIT already runs on EVERY pull request, because the `app` job in ci.yml calls
    # `mvnw install`, which runs all of the module's tests. Repeating the same thing here would be
    # a duplicate with no value.
    #
    # This job does something a single run cannot: it searches for NON-DETERMINISM. The chaos test
    # stops Redis mid-write and relies on the anti-entropy sweep, so its outcome depends on how
    # events line up in time. A test that passes once may have passed by chance; a test that passes
    # ten times in a row under varying runner load is much stronger evidence.
    #
    # The same principle as the property tests above — the nightly run SEARCHES for
    # counterexamples rather than confirming the ones already found.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers brings up Postgres and Redis itself (IntegrationTestBase), so this job
      # needs no `services:` — unlike the e2e job, where the stack has to live outside the JVM
      # because a browser uses it.
      - run: ./mvnw -B install -DskipTests

      - name: Cluster chaos ×10
        run: |
          failed=0
          for run in $(seq 1 10); do
            echo "::group::run $run/10"
            if ! ./mvnw -B -pl app test -Dtest=ClusterChaosIT; then
              failed=$((failed + 1))
              echo "::error::Run $run failed"
              # The reports overwrite each other between runs, so we set the failed one aside.
              mkdir -p failed-runs
              cp -r app/target/surefire-reports "failed-runs/run-$run"
            fi
            echo "::endgroup::"
          done
          echo "Failed runs: $failed/10"
          # One failure in ten is NOT noise — it is precisely the non-determinism this job is
          # looking for. We tolerate none.
          [ "$failed" -eq 0 ]

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chaos-failed-runs
          path: failed-runs/
