name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  crdt-core:
    name: crdt-core - property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: CRDT property tests
        run: ./mvnw -B -pl crdt-core test

      - name: The conformance vectors are current
        run: |
          DRIFT=$(git status --porcelain -- conformance/)
          if [ -n "$DRIFT" ]; then
            echo "::error::The conformance vectors have diverged from the implementation."
            echo "$DRIFT"
            git diff --stat -- conformance/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crdt-core-surefire
          path: crdt-core/target/surefire-reports/

  app:
    name: app - build + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + tests
        run: ./mvnw -B install

      - name: The images still build
        run: |
          docker build -f app/Dockerfile -t collabedit-app:ci .
          docker build -t collabedit-frontend:ci ./frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-surefire
          path: app/target/surefire-reports/

  frontend:
    name: frontend - typecheck + tests + conformance with Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e - two browser contexts on the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collabedit
          POSTGRES_USER: collabedit
          POSTGRES_PASSWORD: collabedit
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U collabedit" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ./mvnw -B install -DskipTests
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: |
          ./mvnw -pl app spring-boot:run > /tmp/backend.log 2>&1 &
          timeout 120 bash -c 'until curl -fsS http://localhost:8090/actuator/health > /dev/null; do sleep 2; done'
        env:
          COLLABEDIT_AUTH_SECRET: ci-only-secret-long-enough-to-be-accepted
          COLLABEDIT_DEV_LOGIN: 'true'
      - run: |
          npm run dev > /tmp/vite.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:5173 > /dev/null; do sleep 1; done'
        working-directory: frontend

      - run: npm run e2e
        working-directory: frontend

      - run: npm run demo
        working-directory: frontend

      - name: Production first-visit offline reload
        run: |
          npm run build
          npm run preview -- --host localhost --port 4173 > /tmp/preview.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:4173 > /dev/null; do sleep 1; done'
          npx playwright test e2e/offline-shell.spec.ts
        working-directory: frontend
        env:
          VITE_API_BASE: http://localhost:8090
          E2E_APP_URL: http://localhost:4173
          E2E_PRODUCTION: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results/
            /tmp/backend.log
            /tmp/vite.log
            /tmp/preview.log
