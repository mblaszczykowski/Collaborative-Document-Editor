name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token should not be able to.
# codeql.yml already scopes its own; this one inherited the repository default.
permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run — property tests can take a while, and
  # there is no point waiting for a result for a commit that is no longer current.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit timeouts on every job. GitHub's default is 360 minutes, which on a hung Testcontainers
# wait or a Playwright run whose backend never came up means six hours of runner and a red build
# nobody can read. Each value is several times the observed runtime — enough that a slow runner
# never trips it, small enough that "stuck" is reported as stuck.
jobs:

  crdt-core:
    name: crdt-core — property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A separate job for the core, because it is the only part that does NOT need Docker
      # (crdt-core has no dependency on the application layer). That way the project's
      # most important test gives feedback fastest, and independently of whether the integration
      # infrastructure came up at all.
      - name: CRDT property tests
        run: ./mvnw -B -pl crdt-core test

      # The conformance vectors are generated by the tests. If the conformance/ directory differs
      # from the one in the repository after they run, somebody changed the algorithm and did not
      # update the corpus — and then the TypeScript suite checks a stale reference and the whole
      # protection against the two implementations diverging stops working.
      - name: The conformance vectors are current
        run: |
          # `git status --porcelain`, not `git diff`: diff compares the working tree against the
          # index for TRACKED paths only, so a vector the generator newly wrote — an added scenario
          # somebody forgot to commit — was invisible to it. The TypeScript suite then replayed a
          # corpus one vector short, and the gate said nothing.
          DRIFT=$(git status --porcelain -- conformance/)
          if [ -n "$DRIFT" ]; then
            echo "::error::The conformance vectors have diverged from the implementation."
            echo "$DRIFT"
            git diff --stat -- conformance/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crdt-core-surefire
          path: crdt-core/target/surefire-reports/

  app:
    name: app — build + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the whole reactor plus Testcontainers plus two image builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is available on GitHub runners with no configuration, so Testcontainers brings up
      # a real Postgres (CLAUDE.md §3.2 — no mocks).
      - name: Build + tests
        run: ./mvnw -B install

      # The images are built but not run. `docker compose --profile app up` is the FIRST way the
      # README tells a reader to start this project, and nothing verified that the Dockerfiles
      # still build — the kind of step that rots silently, and does so in the one path somebody
      # trying the project out takes before any other.
      - name: The images still build
        run: |
          docker build -f app/Dockerfile -t collabedit-app:ci.
          docker build -t collabedit-frontend:ci./frontend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-surefire
          path: app/target/surefire-reports/

  frontend:
    name: frontend — typecheck + tests + conformance with Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # The key consistency test: the TypeScript implementation replays the same vectors the Java
      # implementation generated (the section on two implementations). A divergence in
      # the algorithm must not pass silently.
      - run: npm run test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e — two browser contexts on the full stack
    runs-on: ubuntu-latest
    # 45 rather than 20: this job has two `until curl` loops of its own (120 s and 60 s), so a
    # backend that never starts already costs three minutes before Playwright is reached.
    timeout-minutes: 45
    # The only test that answers whether WHAT THE USER SEES matches the model. The property tests
    # prove the algorithm converges and the integration tests prove the backend is correct, but
    # between the CRDT and the DOM sit CodeMirror and the bridging layer.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collabedit
          POSTGRES_USER: collabedit
          POSTGRES_PASSWORD: collabedit
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U collabedit" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ./mvnw -B install -DskipTests
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The backend and the frontend start as explicit steps rather than hidden in the Playwright
      # configuration — so what this test needs in order to run is visible.
      # TokenService has no default secret since CP16 and refuses to start without one, so
      # that a deployment which forgets this variable fails loudly instead of signing tokens
      # with a key every reader of the repository knows. CI is such a deployment.
      - run: |
          ./mvnw -pl app spring-boot:run > /tmp/backend.log 2>&1 &
          # curl rather than `npx wait-on`: that fetched whatever wait-on@latest resolved to at job
          # time, from a workflow that runs on pull requests, and it was in no lockfile. A retry
          # loop needs no dependency at all.
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health > /dev/null; do sleep 2; done'
        env:
          COLLABEDIT_AUTH_SECRET: ci-only-secret-long-enough-to-be-accepted
      - run: |
          npm run dev > /tmp/vite.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:5173 > /dev/null; do sleep 1; done'
        working-directory: frontend

      - run: npm run e2e
        working-directory: frontend

      # The demo scenario, which `npm run e2e` deliberately excludes because it exists to RECORD
      # rather than to assert. Run here anyway, and the reason is the README's first two images.
      #
      # `tools/make-gif.sh` says the recording comes from a script "so it can be reproduced after
      # every interface change, and the GIF in the README does not silently go stale" — and the
      # README says the recording "shows exactly what CI checks". Neither was true while this was
      # the one end-to-end file CI never ran: the scenario could break, or the interface it walks
      # through could move, and the only signal would be somebody noticing the GIF looked wrong.
      #
      # It costs about thirty seconds and it is the cheapest way to keep a published image honest.
      - run: npm run demo
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results/
            /tmp/backend.log
            /tmp/vite.log
