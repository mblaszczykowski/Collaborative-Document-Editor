version: 2

updates:
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
      observability:
        patterns:
          - "io.opentelemetry*"
          - "io.micrometer*"
      test-tooling:
        patterns:
          - "net.jqwik*"
          - "org.assertj*"
          - "org.testcontainers*"
          - "org.junit*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      observability:
        patterns:
          - "@opentelemetry/*"
      build-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "typescript"
          - "oxlint"
          - "@vitejs/*"
          - "@playwright/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
