# Auto-detekcja lokalnych instalacji JDK — potrzebna, żeby toolchain 21 znalazł JDK
# zainstalowane poza standardową lokalizacją (np. przez SDKMAN/IntelliJ).
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Równoległy build modułów: crdt-core i app są niezależne na etapie kompilacji.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache — przyspiesza kolejne buildy. Włączone świadomie, bo przy
# częstym uruchamianiu property testów w CP2 różnica jest odczuwalna.
org.gradle.configuration-cache=true
