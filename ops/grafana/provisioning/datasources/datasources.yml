apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Powiązanie exemplarów z Tempo: kliknięcie w punkt na histogramie latencji
      # otwiera trace, który go wygenerował. To jest cała wartość exemplarów —
      # bez tego mapowania są martwym polem w metryce.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
