apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # The uid is declared rather than left to Grafana. Tempo's `tracesToMetrics` below refers to
    # this datasource by uid, and without this line Grafana generated a random one at provisioning
    # time — so the reference resolved to nothing and the trace→metric jump silently did not
    # appear. Tempo already declared its uid, which is why the metric→trace direction worked and
    # the missing half looked like a Grafana version difference rather than a typo of ours.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Linking exemplars to Tempo: clicking a point on the latency histogram opens the trace
      # that produced it. That is the entire value of exemplars — without this mapping they are a
      # dead field in the metric.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
