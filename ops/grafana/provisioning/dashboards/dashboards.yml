apiVersion: 1

providers:
  - name: collabedit
    type: file
    # Dashboardy są plikami w repo (./ops/grafana/dashboards), nie stanem klikniętym
    # w UI. Powód: dashboard budowany ręcznie znika przy `docker compose down -v`
    # i nie da się go zrecenzować w pull requeście. Zmiana dashboardu ma być commitem.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
