server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Krótkie okno, żeby trace był wyszukiwalny szybko po zakończeniu — przy demo
  # i przy debugowaniu w CP7 czekanie minutę na pojawienie się trace'u jest bez sensu.
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # 24 h retencji. Projekt portfolio — trace'y sprzed doby nie są do niczego potrzebne,
    # a lokalny dysk nie jest z gumy.
    block_retention: 24h
