receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # CORS potrzebny, bo trace zaczyna się w przeglądarce (ADR-0002 / CP7):
        # span `edit.submit` jest tworzony po stronie klienta i wysyłany bezpośrednio
        # do kolektora. Bez tego pierwszy span łańcucha end-to-end by nie dotarł.
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://localhost:4173"

processors:
  batch:
    # Bufor 1 s. Przy demo z ręcznym klikaniem chcę zobaczyć trace niemal natychmiast;
    # domyślne 5 s sprawia, że podczas nagrywania GIF-a (CP9) trzeba czekać na Grafanę.
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
  telemetry:
    logs:
      level: warn
