receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # CORS is needed because a trace starts in the browser (ADR-0002 / CP7): the
        # `edit.submit` span is created on the client and sent straight to the collector. Without
        # it the first span of the end-to-end chain would never arrive.
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://localhost:4173"

processors:
  batch:
    # A 1 s buffer. During a hands-on demo I want to see a trace almost immediately; the default
    # 5 s means waiting on Grafana while recording the GIF (CP9).
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
  telemetry:
    logs:
      level: warn
