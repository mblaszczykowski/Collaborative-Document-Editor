global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: collabedit-app
    metrics_path: /actuator/prometheus
    scrape_protocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
      - PrometheusText0.0.4
    static_configs:
      - targets: ["host.docker.internal:8090"]
        labels:
          instance: app-local

      - targets: ["host.docker.internal:8081"]
        labels:
          instance: app-2
      - targets: ["host.docker.internal:8082"]
        labels:
          instance: app-3
