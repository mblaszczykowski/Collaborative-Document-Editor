global:
  # 5 s zamiast domyślnych 15 s. Powód: benchmarki w CP8 trwają rzędu 1–3 minut,
  # a przy 15 s scrape'u dostalibyśmy kilkanaście punktów na cały przebieg — za mało,
  # żeby zobaczyć kształt degradacji, a nie tylko wartość średnią.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: collabedit-app
    metrics_path: /actuator/prometheus
    # Exemplars — bez tego przeskok z histogramu latencji do konkretnego trace'u
    # (CP7) nie działa.
    scrape_protocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
      - PrometheusText0.0.4
    static_configs:
      # host.docker.internal: aplikacja startuje z IDE/Gradle na hoście, nie w compose.
      # Świadomie — cykl edycja→restart jest wtedy o rząd wielkości krótszy niż
      # przy przebudowie obrazu, a to jest środowisko deweloperskie.
      - targets: ["host.docker.internal:8080"]
        labels:
          instance: app-local

      # Instancje uruchamiane w compose przy teście skalowania poziomego (ADR-0004).
      # Nieaktywne cele po prostu pokazują się jako "down" — to nie jest błąd konfiguracji.
      - targets: ["host.docker.internal:8081"]
        labels:
          instance: app-2
      - targets: ["host.docker.internal:8082"]
        labels:
          instance: app-3
