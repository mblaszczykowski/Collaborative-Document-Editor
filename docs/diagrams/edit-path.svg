<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The path of a single keystroke</title>
  <desc>From Anna's browser through instance one, the operation log, Redis and instance two, to Marek's browser — with the order of broadcast, write and acknowledgement made explicit.</desc>
  <rect width="940" height="512" fill="#FFFFFF"/>

  <text x="28" y="30" font-size="15" font-weight="600" fill="#16191D">One keystroke, end to end</text>

  <!-- lanes -->
  <g font-size="11.5" text-anchor="middle" font-weight="600" fill="#16191D">
    <text x="86"  y="58">Anna</text>
    <text x="246" y="58">instance #1</text>
    <text x="406" y="58">operation log</text>
    <text x="566" y="58">Redis</text>
    <text x="726" y="58">instance #2</text>
    <text x="886" y="58">Marek</text>
  </g>
  <g stroke="#D6DAE0" stroke-width="1.4">
    <line x1="86"  y1="70" x2="86"  y2="452"/>
    <line x1="246" y1="70" x2="246" y2="452"/>
    <line x1="406" y1="70" x2="406" y2="452"/>
    <line x1="566" y1="70" x2="566" y2="452"/>
    <line x1="726" y1="70" x2="726" y2="452"/>
    <line x1="886" y1="70" x2="886" y2="452"/>
  </g>

  <!-- 1 local -->
  <rect x="30" y="82" width="112" height="30" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.2"/>
  <text x="86" y="101" font-size="10.5" text-anchor="middle" fill="#16191D">insert locally</text>
  <text x="150" y="101" font-size="10.5" fill="#2563A8">visible immediately — no round trip</text>

  <!-- 2 send -->
  <path d="M 86 134 L 240 134" stroke="#2563A8" stroke-width="1.6" fill="none"/>
  <path d="M 246 134 l -8 -5 v 10 z" fill="#2563A8"/>
  <text x="166" y="128" font-size="10.5" text-anchor="middle" fill="#2563A8">operation + traceparent</text>

  <!-- 3 authz + merge -->
  <rect x="192" y="148" width="108" height="42" rx="5" fill="#F9EAE6" stroke="#B4402E" stroke-width="1.2"/>
  <text x="246" y="164" font-size="10.5" text-anchor="middle" fill="#16191D">authorize frame</text>
  <text x="246" y="180" font-size="10.5" text-anchor="middle" fill="#16191D">merge</text>

  <!-- 4 broadcast -->
  <rect x="152" y="200" width="188" height="30" rx="5" fill="#FBF2DE" stroke="#B07908" stroke-width="1.2"/>
  <text x="246" y="219" font-size="10.5" text-anchor="middle" fill="#16191D">broadcast to its own clients</text>
  <text x="356" y="212" font-size="10.5" fill="#B07908">10 ms batch, and it happens BEFORE the write</text>
  <text x="356" y="228" font-size="10.5" fill="#667085">— so this is the step the user actually experiences</text>

  <!-- 5 write -->
  <path d="M 246 264 L 400 264" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 406 264 l -8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="326" y="258" font-size="10.5" text-anchor="middle" fill="#1F7A5C">write &#183; 50 ms batch</text>

  <path d="M 406 292 L 252 292" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 246 292 l 8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="326" y="286" font-size="10.5" text-anchor="middle" fill="#1F7A5C">server_seq assigned</text>

  <!-- 6 ack -->
  <path d="M 240 320 L 92 320" stroke="#1F7A5C" stroke-width="2" fill="none"/>
  <path d="M 86 320 l 8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="166" y="314" font-size="10.5" text-anchor="middle" fill="#1F7A5C" font-weight="600">acknowledgement</text>
  <rect x="24" y="330" width="200" height="22" rx="4" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.1"/>
  <text x="34" y="345" font-size="10.5" fill="#16191D" font-weight="600">only now does the outbox release</text>

  <!-- 7 redis -->
  <path d="M 246 376 L 560 376" stroke="#B07908" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <path d="M 566 376 l -8 -5 v 10 z" fill="#B07908"/>
  <text x="406" y="370" font-size="10.5" text-anchor="middle" fill="#B07908">publish — may be lost</text>

  <path d="M 566 404 L 720 404" stroke="#B07908" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <path d="M 726 404 l -8 -5 v 10 z" fill="#B07908"/>
  <text x="646" y="398" font-size="10.5" text-anchor="middle" fill="#B07908">operation</text>

  <path d="M 726 432 L 880 432" stroke="#B07908" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <path d="M 886 432 l -8 -5 v 10 z" fill="#B07908"/>
  <text x="806" y="426" font-size="10.5" text-anchor="middle" fill="#667085">merge, then broadcast</text>

  <!-- repair note -->
  <rect x="28" y="466" width="884" height="34" rx="6" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="44" y="488" font-size="11.5" fill="#16191D">If the publish is lost, instance #2 never learns of it from Redis. The anti-entropy sweep notices the log has moved past what it applied, and pulls the missing range.</text>
</svg>
