<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Ordering two concurrent inserts in RGA</title>
  <desc>Ann and Bo both type at the end of "ok" without having seen each other. Both replicas apply the insertion rule and reach the same text.</desc>
  <rect width="880" height="452" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="15" font-weight="600" fill="#16191D">Both typed at the end of “ok”. Neither had seen the other.</text>

  <!-- the two operations -->
  <rect x="32" y="54" width="380" height="46" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.2"/>
  <text x="48" y="74" font-size="11.5" fill="#2563A8" font-weight="600">ANN &#183; replica 1</text>
  <text x="48" y="91" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">Insert { id: 1@5, originLeft: k, text: "!" }</text>

  <rect x="468" y="54" width="380" height="46" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.2"/>
  <text x="484" y="74" font-size="11.5" fill="#2563A8" font-weight="600">BO &#183; replica 2</text>
  <text x="484" y="91" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">Insert { id: 2@5, originLeft: k, text: "?" }</text>

  <line x1="32" y1="120" x2="848" y2="120" stroke="#D6DAE0" stroke-width="1"/>
  <text x="440" y="140" font-size="12" fill="#667085" text-anchor="middle">both operations reach both replicas, in whatever order the network feels like</text>

  <!-- LEFT: Ann's replica -->
  <text x="32" y="168" font-size="12.5" font-weight="600" fill="#16191D">Ann’s replica receives 2@5</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="32"  y="190" width="34" height="34" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="49"  y="213" font-size="15" text-anchor="middle" fill="#16191D">o</text>
    <rect x="72"  y="190" width="34" height="34" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="89"  y="213" font-size="15" text-anchor="middle" fill="#16191D">k</text>
    <text x="89"  y="240" font-size="10" text-anchor="middle" fill="#667085">origin</text>
    <rect x="112" y="190" width="34" height="34" rx="5" fill="#EAF1F9" stroke="#2563A8"/>
    <text x="129" y="213" font-size="15" text-anchor="middle" fill="#16191D">!</text>
    <text x="129" y="240" font-size="10" text-anchor="middle" fill="#2563A8">1@5</text>
  </g>
  <path d="M 106 182 L 158 182" stroke="#B07908" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <path d="M 162 182 l -6 -4 v 8 z" fill="#B07908"/>
  <text x="168" y="204" font-size="11.5" fill="#B07908">walk right from the origin</text>
  <text x="168" y="220" font-size="11.5" fill="#16191D">meet 1@5 &#183; is 1@5 &gt; 2@5 ?</text>
  <text x="168" y="236" font-size="11.5" font-weight="600" fill="#B4402E">no &#8594; stop, insert here</text>

  <!-- RIGHT: Bo's replica -->
  <text x="468" y="168" font-size="12.5" font-weight="600" fill="#16191D">Bo’s replica receives 1@5</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="468" y="190" width="34" height="34" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="485" y="213" font-size="15" text-anchor="middle" fill="#16191D">o</text>
    <rect x="508" y="190" width="34" height="34" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="525" y="213" font-size="15" text-anchor="middle" fill="#16191D">k</text>
    <text x="525" y="240" font-size="10" text-anchor="middle" fill="#667085">origin</text>
    <rect x="548" y="190" width="34" height="34" rx="5" fill="#EAF1F9" stroke="#2563A8"/>
    <text x="565" y="213" font-size="15" text-anchor="middle" fill="#16191D">?</text>
    <text x="565" y="240" font-size="10" text-anchor="middle" fill="#2563A8">2@5</text>
  </g>
  <path d="M 542 182 L 594 182" stroke="#B07908" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <path d="M 598 182 l -6 -4 v 8 z" fill="#B07908"/>
  <text x="604" y="204" font-size="11.5" fill="#B07908">walk right from the origin</text>
  <text x="604" y="220" font-size="11.5" fill="#16191D">meet 2@5 &#183; is 2@5 &gt; 1@5 ?</text>
  <text x="604" y="236" font-size="11.5" font-weight="600" fill="#1F7A5C">yes &#8594; skip &#8594; end of list</text>

  <!-- the rule -->
  <rect x="32" y="268" width="816" height="44" rx="6" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="48" y="286" font-size="12.5" fill="#16191D"><tspan font-weight="600">The rule:</tspan> find the origin, walk right while the block you meet has a <tspan font-weight="600">higher</tspan> identifier, stop at the first lower one.</text>
  <text x="48" y="304" font-size="12.5" fill="#667085">Identifiers compare by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">(lamport, replicaId)</tspan>, which is a total order &#8212; so it can never tie.</text>

  <!-- converged result -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="352" y="342" width="34" height="34" rx="5" fill="#E7F3EE" stroke="#1F7A5C"/>
    <text x="369" y="365" font-size="15" text-anchor="middle" fill="#16191D">o</text>
    <rect x="392" y="342" width="34" height="34" rx="5" fill="#E7F3EE" stroke="#1F7A5C"/>
    <text x="409" y="365" font-size="15" text-anchor="middle" fill="#16191D">k</text>
    <rect x="432" y="342" width="34" height="34" rx="5" fill="#E7F3EE" stroke="#1F7A5C"/>
    <text x="449" y="365" font-size="15" text-anchor="middle" fill="#16191D">?</text>
    <text x="449" y="392" font-size="10" text-anchor="middle" fill="#1F7A5C">2@5</text>
    <rect x="472" y="342" width="34" height="34" rx="5" fill="#E7F3EE" stroke="#1F7A5C"/>
    <text x="489" y="365" font-size="15" text-anchor="middle" fill="#16191D">!</text>
    <text x="489" y="392" font-size="10" text-anchor="middle" fill="#1F7A5C">1@5</text>
  </g>
  <path d="M 190 359 L 336 359" stroke="#D6DAE0" stroke-width="1.2" fill="none"/>
  <path d="M 690 359 L 544 359" stroke="#D6DAE0" stroke-width="1.2" fill="none"/>

  <text x="440" y="424" font-size="12.5" text-anchor="middle" fill="#16191D">Same text, opposite delivery order. No message was rewritten and nothing was rolled back.</text>
</svg>
