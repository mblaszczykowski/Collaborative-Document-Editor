<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" width="880" height="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>System architecture</title>
  <desc>A browser holding its own RGA replica talks over STOMP to backend instances, each of which also holds a replica. Postgres holds the operation log and is the source of truth; Redis is a best-effort fast path between instances.</desc>
  <rect width="880" height="528" fill="#FFFFFF"/>

  <text x="32" y="32" font-size="15" font-weight="600" fill="#16191D">Four RGA replicas on this picture. All of them are peers.</text>

  <!-- BROWSER -->
  <rect x="32" y="52" width="264" height="212" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.6"/>
  <text x="48" y="76" font-size="12.5" font-weight="600" fill="#2563A8">BROWSER</text>

  <rect x="48" y="88" width="232" height="36" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="60" y="104" font-size="12" fill="#16191D">CodeMirror 6</text>
  <text x="60" y="118" font-size="10.5" fill="#667085">view layer only — the model is ours</text>

  <rect x="48" y="132" width="232" height="46" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.3"/>
  <text x="60" y="149" font-size="12" font-weight="600" fill="#16191D">crdt/ — RGA replica</text>
  <text x="60" y="164" font-size="10.5" fill="#667085">+ mark layer, undo, snapshot decoding</text>

  <rect x="48" y="186" width="232" height="62" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="60" y="203" font-size="12" fill="#16191D">transport/</text>
  <text x="60" y="218" font-size="10.5" fill="#667085">STOMP client &#183; gap detection</text>
  <text x="60" y="233" font-size="10.5" fill="#667085">offline buffer (IndexedDB) &#183; network simulator</text>

  <!-- INSTANCE 1 -->
  <rect x="336" y="52" width="252" height="212" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.6"/>
  <text x="352" y="76" font-size="12.5" font-weight="600" fill="#2563A8">BACKEND INSTANCE #1</text>

  <rect x="352" y="88" width="220" height="36" rx="5" fill="#F9EAE6" stroke="#B4402E" stroke-width="1.3"/>
  <text x="364" y="104" font-size="12" font-weight="600" fill="#16191D">per-frame authorization</text>
  <text x="364" y="118" font-size="10.5" fill="#B4402E">role &#8594; operation type, on every frame</text>

  <rect x="352" y="132" width="220" height="46" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.3"/>
  <text x="364" y="149" font-size="12" font-weight="600" fill="#16191D">RGA replica</text>
  <text x="364" y="164" font-size="10.5" fill="#667085">+ mark layer — the same algorithm</text>

  <rect x="352" y="186" width="220" height="62" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="364" y="203" font-size="10.5" fill="#667085">persist/ log, snapshots, search</text>
  <text x="364" y="218" font-size="10.5" fill="#667085">history/ time travel, diff, restore</text>
  <text x="364" y="233" font-size="10.5" fill="#667085">comments/ suggestions/ auth/</text>

  <!-- INSTANCE 2 -->
  <rect x="628" y="52" width="220" height="212" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.6"/>
  <text x="644" y="76" font-size="12.5" font-weight="600" fill="#2563A8">INSTANCE #2</text>
  <rect x="644" y="132" width="188" height="46" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.3"/>
  <text x="656" y="149" font-size="12" font-weight="600" fill="#16191D">RGA replica</text>
  <text x="656" y="164" font-size="10.5" fill="#667085">+ mark layer</text>
  <text x="644" y="204" font-size="10.5" fill="#667085">Identical to #1. Drawn short only</text>
  <text x="644" y="219" font-size="10.5" fill="#667085">to keep the picture readable —</text>
  <text x="644" y="234" font-size="10.5" fill="#667085">authorization runs here too.</text>

  <!-- links -->
  <path d="M 296 155 L 330 155" stroke="#2563A8" stroke-width="1.8" fill="none"/>
  <path d="M 336 155 l -8 -5 v 10 z" fill="#2563A8"/>
  <path d="M 336 168 L 302 168" stroke="#2563A8" stroke-width="1.8" fill="none"/>
  <path d="M 296 168 l 8 -5 v 10 z" fill="#2563A8"/>
  <text x="316" y="140" font-size="10.5" text-anchor="middle" fill="#2563A8">WebSocket</text>
  <text x="316" y="192" font-size="10.5" text-anchor="middle" fill="#667085">STOMP</text>

  <!-- REDIS -->
  <rect x="336" y="308" width="252" height="52" rx="6" fill="#FBF2DE" stroke="#B07908" stroke-width="1.6"/>
  <text x="462" y="330" font-size="12.5" text-anchor="middle" font-weight="600" fill="#16191D">Redis pub/sub</text>
  <text x="462" y="348" font-size="11" text-anchor="middle" fill="#B07908">fast path &#183; best effort &#183; may drop</text>

  <path d="M 430 264 L 430 302" stroke="#B07908" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M 700 264 L 700 334 L 594 334" stroke="#B07908" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>

  <!-- POSTGRES -->
  <rect x="290" y="400" width="344" height="58" rx="6" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.8"/>
  <text x="462" y="423" font-size="12.5" text-anchor="middle" font-weight="600" fill="#16191D">PostgreSQL — operation log</text>
  <text x="462" y="442" font-size="11" text-anchor="middle" fill="#1F7A5C">SOURCE OF TRUTH &#183; snapshots are a disposable cache</text>

  <path d="M 360 264 L 360 280 L 312 280 L 312 392" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 312 400 l -5 -8 h 10 z" fill="#1F7A5C"/>
  <path d="M 790 264 L 790 429 L 640 429" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 634 429 l 8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="304" y="388" font-size="10.5" text-anchor="end" fill="#1F7A5C">write</text>
  <text x="806" y="352" font-size="10.5" fill="#1F7A5C">write</text>

  <rect x="32" y="306" width="264" height="60" rx="6" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.2"/>
  <text x="46" y="326" font-size="11.5" fill="#1F7A5C" font-weight="600">anti-entropy sweep</text>
  <text x="46" y="343" font-size="10.5" fill="#667085">replays from the log anything Redis</text>
  <text x="46" y="358" font-size="10.5" fill="#667085">dropped, so a lost message is latency</text>
  <path d="M 296 334 L 330 334" stroke="#1F7A5C" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <path d="M 336 334 l -8 -5 v 10 z" fill="#1F7A5C"/>

  <rect x="32" y="474" width="816" height="44" rx="6" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="48" y="493" font-size="12" fill="#16191D"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">crdt-core</tspan> is a separate Maven module with zero Spring dependencies, so the algorithm can be tested and benchmarked alone —</text>
  <text x="48" y="510" font-size="12" fill="#667085">and so the compiler stops the application layer leaking into it.</text>
</svg>
