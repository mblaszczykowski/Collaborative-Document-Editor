<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>When a tombstone may be collected</title>
  <desc>The server takes the component-wise minimum of the version vectors reported by connected replicas. A tombstone may go only when the delete that produced it is below that minimum.</desc>
  <rect width="880" height="384" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="15" font-weight="600" fill="#16191D">A tombstone goes only when everybody has seen the delete</text>
  <text x="32" y="56" font-size="12" fill="#667085">Each connected replica reports what it has. The server takes the component-wise minimum.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="32" y="94" fill="#667085">replica 1</text>
    <text x="140" y="94" fill="#16191D">{ 1:120,  2: 98,  3:115 }</text>
    <text x="32" y="118" fill="#667085">replica 2</text>
    <text x="140" y="118" fill="#16191D">{ 1:118,  2:101,  3:115 }</text>
    <text x="32" y="142" fill="#667085">replica 3</text>
    <text x="140" y="142" fill="#16191D">{ 1:120,  2: 99,  3:117 }</text>
  </g>

  <line x1="140" y1="156" x2="420" y2="156" stroke="#16191D" stroke-width="1.2"/>
  <text x="440" y="152" font-size="11.5" fill="#667085">component-wise minimum</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="32" y="180" fill="#1F7A5C" font-weight="600">stable</text>
    <text x="140" y="180" fill="#16191D" font-weight="600">{ 1:118,  2: 98,  3:115 }</text>
  </g>

  <line x1="32" y1="206" x2="848" y2="206" stroke="#D6DAE0" stroke-width="1"/>

  <rect x="32" y="226" width="392" height="74" rx="6" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.2"/>
  <text x="52" y="250" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">tombstone deleted by 2@97</text>
  <text x="52" y="270" font-size="12" fill="#667085"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">97 &#8804; 98</tspan> — nobody can still be showing it</text>
  <text x="52" y="290" font-size="12.5" font-weight="600" fill="#1F7A5C">collectable</text>

  <rect x="456" y="226" width="392" height="74" rx="6" fill="#F9EAE6" stroke="#B4402E" stroke-width="1.2"/>
  <text x="476" y="250" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">tombstone deleted by 2@99</text>
  <text x="476" y="270" font-size="12" fill="#667085"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">99 &gt; 98</tspan> — replica 1 may still be showing it</text>
  <text x="476" y="290" font-size="12.5" font-weight="600" fill="#B4402E">keep</text>

  <rect x="32" y="318" width="816" height="52" rx="6" fill="#FBF2DE" stroke="#B07908" stroke-width="1.2"/>
  <text x="52" y="340" font-size="12.5" fill="#16191D">The test is on the <tspan font-weight="600">delete</tspan>, not on the insert. An audit found it on the insert, which is the same thing only if nothing is ever</text>
  <text x="52" y="358" font-size="12.5" fill="#16191D">deleted quickly: a paragraph written last week and deleted a second ago was collectable while a peer 10 ms behind still showed it.</text>
</svg>
