<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A comment is half in the CRDT and half out</title>
  <desc>The conversation goes over REST into ordinary Postgres tables. Only the anchor — the highlighted range — is a CRDT operation, and it can only be created once the thread has an identifier.</desc>
  <rect width="880" height="452" fill="#FFFFFF"/>

  <text x="32" y="32" font-size="15" font-weight="600" fill="#16191D">The highlight is a CRDT operation. The conversation is rows in Postgres.</text>

  <g font-size="11.5" text-anchor="middle" font-weight="600" fill="#16191D">
    <text x="96"  y="62">Marek</text>
    <text x="316" y="62">REST</text>
    <text x="536" y="62">Postgres</text>
    <text x="756" y="62">Anna</text>
  </g>
  <g stroke="#D6DAE0" stroke-width="1.4">
    <line x1="96"  y1="74" x2="96"  y2="342"/>
    <line x1="316" y1="74" x2="316" y2="342"/>
    <line x1="536" y1="74" x2="536" y2="342"/>
    <line x1="756" y1="74" x2="756" y2="342"/>
  </g>

  <path d="M 96 100 L 310 100" stroke="#667085" stroke-width="1.5" fill="none"/>
  <path d="M 316 100 l -8 -5 v 10 z" fill="#667085"/>
  <text x="206" y="94" font-size="10.5" text-anchor="middle" fill="#667085">thread text + the quoted fragment</text>

  <path d="M 316 128 L 530 128" stroke="#667085" stroke-width="1.5" fill="none"/>
  <path d="M 536 128 l -8 -5 v 10 z" fill="#667085"/>
  <text x="426" y="122" font-size="10.5" text-anchor="middle" fill="#667085">INSERT thread + message</text>

  <path d="M 536 156 L 322 156" stroke="#667085" stroke-width="1.5" fill="none"/>
  <path d="M 316 156 l 8 -5 v 10 z" fill="#667085"/>
  <path d="M 310 178 L 102 178" stroke="#667085" stroke-width="1.5" fill="none"/>
  <path d="M 96 178 l 8 -5 v 10 z" fill="#667085"/>
  <text x="206" y="172" font-size="10.5" text-anchor="middle" fill="#667085">thread identifier</text>

  <rect x="120" y="196" width="470" height="24" rx="4" fill="#FBF2DE" stroke="#B07908" stroke-width="1.1"/>
  <text x="132" y="212" font-size="11" fill="#16191D">only <tspan font-weight="600">now</tspan> can the anchor be created — it carries the thread identifier as its value</text>

  <path d="M 96 248 L 750 248" stroke="#2563A8" stroke-width="1.8" fill="none"/>
  <path d="M 756 248 l -8 -5 v 10 z" fill="#2563A8"/>
  <text x="426" y="242" font-size="10.5" text-anchor="middle" fill="#2563A8" font-weight="600">AddMark(type = comment, value = thread id) over STOMP</text>

  <rect x="640" y="260" width="232" height="24" rx="4" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.1"/>
  <text x="652" y="276" font-size="11" fill="#16191D">the fragment highlights <tspan font-weight="600">immediately</tspan></text>

  <path d="M 750 310 L 322 310" stroke="#667085" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M 316 310 l 8 -5 v 10 z" fill="#667085"/>
  <text x="536" y="304" font-size="10.5" text-anchor="middle" fill="#667085">the conversation text arrives separately, when the panel refreshes</text>

  <line x1="32" y1="364" x2="848" y2="364" stroke="#D6DAE0" stroke-width="1"/>
  <text x="32" y="388" font-size="12" fill="#16191D"><tspan font-weight="600">Why split them.</tspan> A range has to merge without an arbiter while people edit around it — that is a CRDT problem. A sentence written by</text>
  <text x="32" y="406" font-size="12" fill="#16191D">one person has a single author and an obvious order; running it through a merge algorithm buys nothing and costs a lot.</text>
  <text x="32" y="430" font-size="12" fill="#667085">The consequence is a window where a thread exists with no anchor yet. Known and accepted, not an oversight.</text>
</svg>
