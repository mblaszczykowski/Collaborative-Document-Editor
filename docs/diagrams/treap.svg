<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The treap index over the block list</title>
  <desc>A balanced binary search tree keyed by document order. Each node carries its subtree's visible and total character counts, which is what makes position lookup and identifier lookup both logarithmic.</desc>
  <rect width="880" height="424" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="15" font-weight="600" fill="#16191D">Every node carries its subtree’s character counts. That is the whole trick.</text>

  <!-- edges -->
  <line x1="440" y1="126" x2="212" y2="196" stroke="#D6DAE0" stroke-width="1.6"/>
  <line x1="440" y1="126" x2="668" y2="196" stroke="#D6DAE0" stroke-width="1.6"/>

  <!-- root -->
  <rect x="320" y="62" width="240" height="64" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
  <text x="336" y="83" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">1@40  "world"</text>
  <text x="336" y="101" font-size="11" fill="#667085">own: visible 5 &#183; total 5</text>
  <text x="336" y="118" font-size="11" fill="#2563A8" font-weight="600">subtree: visible 11 &#183; total 17</text>

  <!-- left child -->
  <rect x="92" y="196" width="240" height="64" rx="6" fill="#F4F5F7" stroke="#D6DAE0" stroke-width="1.4"/>
  <text x="108" y="217" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">1@1   "Hello "</text>
  <text x="108" y="235" font-size="11" fill="#667085">own: visible 6 &#183; total 6</text>
  <text x="108" y="252" font-size="11" fill="#667085">subtree: visible 6 &#183; total 6</text>

  <!-- right child -->
  <rect x="548" y="196" width="240" height="64" rx="6" fill="#FBF2DE" stroke="#B07908" stroke-width="1.4"/>
  <text x="564" y="217" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">2@12  &#10007; tombstone</text>
  <text x="564" y="235" font-size="11" fill="#667085">own: visible 0 &#183; total 6</text>
  <text x="564" y="252" font-size="11" fill="#667085">subtree: visible 0 &#183; total 6</text>

  <line x1="32" y1="292" x2="848" y2="292" stroke="#D6DAE0" stroke-width="1"/>

  <text x="32" y="318" font-size="12.5" fill="#16191D"><tspan font-weight="600">position &#8594; identifier</tspan></text>
  <text x="32" y="337" font-size="11.5" fill="#667085">descend, comparing the target against the left</text>
  <text x="32" y="354" font-size="11.5" fill="#667085">subtree’s <tspan fill="#16191D" font-weight="600">visible</tspan> count. Tombstones are skipped</text>
  <text x="32" y="371" font-size="11.5" fill="#667085">for free, because they contribute zero to it.</text>

  <text x="468" y="318" font-size="12.5" fill="#16191D"><tspan font-weight="600">identifier &#8594; position</tspan></text>
  <text x="468" y="337" font-size="11.5" fill="#667085">find the node in a hash index, then walk to the</text>
  <text x="468" y="354" font-size="11.5" fill="#667085">root summing the visible counts of everything</text>
  <text x="468" y="371" font-size="11.5" fill="#667085">hanging to the left of the path.</text>

  <rect x="32" y="388" width="816" height="26" rx="5" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.1"/>
  <text x="46" y="405" font-size="11.5" fill="#16191D">The heap priority is a hash of the block’s identifier rather than a random number, so every replica builds the <tspan font-weight="600">same tree shape</tspan>.</text>
</svg>
