<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>What releases an operation from the offline buffer, and how a lost broadcast is noticed</title>
  <desc>The client's outbox releases on the write acknowledgement, never on the broadcast. The acknowledgement carries the operation's identity, which is what makes a lost broadcast detectable.</desc>
  <rect width="880" height="452" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="15" font-weight="600" fill="#16191D">The outbox releases on the write, not on the broadcast</text>

  <!-- lanes -->
  <text x="90"  y="70" font-size="12" font-weight="600" text-anchor="middle" fill="#16191D">client</text>
  <text x="440" y="70" font-size="12" font-weight="600" text-anchor="middle" fill="#16191D">server</text>
  <text x="790" y="70" font-size="12" font-weight="600" text-anchor="middle" fill="#16191D">operation log</text>
  <line x1="90"  y1="82" x2="90"  y2="300" stroke="#D6DAE0" stroke-width="1.4"/>
  <line x1="440" y1="82" x2="440" y2="300" stroke="#D6DAE0" stroke-width="1.4"/>
  <line x1="790" y1="82" x2="790" y2="300" stroke="#D6DAE0" stroke-width="1.4"/>

  <!-- op -->
  <path d="M 90 104 L 434 104" stroke="#2563A8" stroke-width="1.6" fill="none"/>
  <path d="M 440 104 l -8 -5 v 10 z" fill="#2563A8"/>
  <text x="262" y="98" font-size="11.5" text-anchor="middle" fill="#2563A8">operation</text>

  <text x="452" y="130" font-size="11.5" fill="#667085">merge into the replica</text>

  <!-- broadcast -->
  <path d="M 440 156 L 96 156" stroke="#B07908" stroke-width="1.6" stroke-dasharray="5 3" fill="none"/>
  <path d="M 90 156 l 8 -5 v 10 z" fill="#B07908"/>
  <text x="262" y="150" font-size="11.5" text-anchor="middle" fill="#B07908">broadcast to everyone &#183; 10 ms batch</text>
  <text x="262" y="172" font-size="11" text-anchor="middle" fill="#667085">this is the step the user actually sees</text>

  <!-- write -->
  <path d="M 440 204 L 784 204" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 790 204 l -8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="614" y="198" font-size="11.5" text-anchor="middle" fill="#1F7A5C">write &#183; 50 ms batch</text>

  <path d="M 790 232 L 446 232" stroke="#1F7A5C" stroke-width="1.6" fill="none"/>
  <path d="M 440 232 l 8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="614" y="226" font-size="11.5" text-anchor="middle" fill="#1F7A5C">server_seq assigned</text>

  <!-- ack -->
  <path d="M 434 260 L 96 260" stroke="#1F7A5C" stroke-width="2" fill="none"/>
  <path d="M 90 260 l 8 -5 v 10 z" fill="#1F7A5C"/>
  <text x="262" y="254" font-size="11.5" text-anchor="middle" fill="#1F7A5C" font-weight="600">acknowledgement, carrying the operation’s identity</text>

  <rect x="32" y="272" width="330" height="24" rx="4" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.1"/>
  <text x="46" y="288" font-size="11.5" fill="#16191D" font-weight="600">only now does the outbox release the operation</text>

  <rect x="32" y="316" width="816" height="42" rx="6" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="48" y="334" font-size="12" fill="#16191D">If the instance dies between the broadcast and the write, the operation is on other people’s screens but not in the log.</text>
  <text x="48" y="351" font-size="12" fill="#667085">The buffer never released it, so the client retransmits. Releasing on the broadcast would have lost it silently.</text>

  <!-- gap detection -->
  <line x1="32" y1="376" x2="848" y2="376" stroke="#D6DAE0" stroke-width="1"/>
  <text x="32" y="400" font-size="12.5" font-weight="600" fill="#16191D">The reverse failure: a broadcast to one client is lost. Nothing errors.</text>
  <text x="32" y="420" font-size="12" fill="#667085">Watching <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">server_seq</tspan> for holes doesn’t help — the cursor advances on acknowledgements, which everybody receives, so it looks current.</text>
  <text x="32" y="440" font-size="12" fill="#16191D">So the client asks a different question: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">an ack for 7@41 arrived — did I ever handle 7@41 itself?</tspan> <tspan fill="#B4402E" font-weight="600">No &#8594; resynchronise.</tspan></text>
</svg>
