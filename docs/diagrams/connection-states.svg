<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Client connection states</title>
  <desc>Connecting, resynchronising, online and offline, plus the two exits: a detected gap sends the client back to resynchronise, and a refusal after the garbage-collection window saves the local version as a recovered draft.</desc>
  <rect width="880" height="470" fill="#FFFFFF"/>

  <text x="32" y="32" font-size="15" font-weight="600" fill="#16191D">Client connection states</text>

  <!-- gap loop, routed above the row so it crosses nothing -->
  <text x="500" y="52" font-size="11" text-anchor="middle" fill="#B4402E"><tspan font-weight="600">GAP DETECTED</tspan> — an acknowledgement for an operation we never handled</text>
  <path d="M 609 88 L 609 64 L 366 64 L 366 80" stroke="#B4402E" stroke-width="1.6" fill="none"/>
  <path d="M 366 88 l -5 -8 h 10 z" fill="#B4402E"/>

  <rect x="48" y="88" width="150" height="44" rx="8" fill="#F4F5F7" stroke="#D6DAE0" stroke-width="1.4"/>
  <text x="123" y="115" font-size="12.5" text-anchor="middle" fill="#16191D">Connecting</text>

  <rect x="278" y="88" width="176" height="44" rx="8" fill="#FBF2DE" stroke="#B07908" stroke-width="1.4"/>
  <text x="366" y="115" font-size="12.5" text-anchor="middle" fill="#16191D">Resynchronising</text>

  <rect x="534" y="88" width="150" height="44" rx="8" fill="#E7F3EE" stroke="#1F7A5C" stroke-width="1.6"/>
  <text x="609" y="115" font-size="12.5" text-anchor="middle" font-weight="600" fill="#16191D">Online</text>

  <path d="M 198 110 L 272 110" stroke="#667085" stroke-width="1.4" fill="none"/>
  <path d="M 278 110 l -8 -5 v 10 z" fill="#667085"/>
  <text x="235" y="102" font-size="10.5" text-anchor="middle" fill="#667085">connected</text>

  <path d="M 454 110 L 528 110" stroke="#667085" stroke-width="1.4" fill="none"/>
  <path d="M 534 110 l -8 -5 v 10 z" fill="#667085"/>
  <text x="491" y="102" font-size="10.5" text-anchor="middle" fill="#667085">caught up</text>

  <rect x="534" y="196" width="150" height="44" rx="8" fill="#F4F5F7" stroke="#667085" stroke-width="1.4"/>
  <text x="609" y="223" font-size="12.5" text-anchor="middle" fill="#16191D">Offline</text>

  <path d="M 684 110 L 760 110 L 760 218 L 690 218" stroke="#667085" stroke-width="1.4" fill="none"/>
  <path d="M 684 218 l 8 -5 v 10 z" fill="#667085"/>
  <text x="772" y="150" font-size="10.5" fill="#667085">socket error,</text>
  <text x="772" y="166" font-size="10.5" fill="#667085">or the browser’s</text>
  <text x="772" y="182" font-size="10.5" fill="#667085">offline event</text>

  <!-- offline back to connecting, round the outside; the one crossing is dashed vs solid -->
  <path d="M 534 218 L 28 218 L 28 110 L 42 110" stroke="#667085" stroke-width="1.4" fill="none"/>
  <path d="M 48 110 l -8 -5 v 10 z" fill="#667085"/>
  <text x="200" y="210" font-size="10.5" text-anchor="middle" fill="#667085">retry — exponential backoff with jitter</text>

  <rect x="278" y="300" width="200" height="44" rx="8" fill="#F9EAE6" stroke="#B4402E" stroke-width="1.4"/>
  <text x="378" y="327" font-size="12.5" text-anchor="middle" fill="#16191D">Recovered draft</text>

  <path d="M 366 132 L 366 292" stroke="#B4402E" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M 366 300 l -5 -8 h 10 z" fill="#B4402E"/>

  <text x="512" y="306" font-size="11.5" fill="#B4402E" font-weight="600">RESYNC_REQUIRED</text>
  <text x="512" y="324" font-size="10.5" fill="#667085">Offline for longer than the 7-day collection window, so the</text>
  <text x="512" y="339" font-size="10.5" fill="#667085">anchor point is gone. The local version is saved as a separate</text>
  <text x="512" y="354" font-size="10.5" fill="#667085">document rather than merged on a guess.</text>

  <rect x="32" y="382" width="410" height="62" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.2"/>
  <text x="48" y="403" font-size="11.5" font-weight="600" fill="#16191D">Editing continues while offline.</text>
  <text x="48" y="421" font-size="11" fill="#667085">Operations go to an IndexedDB buffer that survives the tab</text>
  <text x="48" y="436" font-size="11" fill="#667085">closing, and drains on reconnect.</text>

  <rect x="480" y="382" width="368" height="62" rx="6" fill="#F4F5F7" stroke="#D6DAE0"/>
  <text x="496" y="403" font-size="11.5" fill="#16191D">The heartbeat is not what the user experiences.</text>
  <text x="496" y="421" font-size="11" fill="#667085">The client reacts to socket errors and the browser’s own</text>
  <text x="496" y="436" font-size="11" fill="#667085">events, which fire at once. The broker timeout is a backstop.</text>
</svg>
