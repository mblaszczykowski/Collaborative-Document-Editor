<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Which side an anchor sits on decides whether formatting grows</title>
  <desc>An anchor after b and an anchor before c point at the same gap until somebody types into it. That difference is what makes bold expand and a link not expand.</desc>
  <rect width="880" height="356" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="15" font-weight="600" fill="#16191D">Same gap, two anchors — until somebody types into it</text>
  <text x="32" y="56" font-size="12" fill="#667085">Text is <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">a b c</tspan>, with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">b</tspan> formatted. The end anchor of that range can sit on either side of the gap after <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">b</tspan>.</text>

  <!-- CASE 1 -->
  <rect x="32" y="80" width="392" height="240" rx="6" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="1.2"/>
  <text x="52" y="106" font-size="12.5" font-weight="600" fill="#16191D">end = AFTER(b)</text>
  <text x="52" y="124" font-size="11.5" fill="#667085">the range ends just <tspan fill="#16191D">after</tspan> the character b</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="52"  y="140" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="68"  y="162" font-size="14" text-anchor="middle" fill="#16191D">a</text>
    <rect x="88"  y="140" width="32" height="32" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
    <text x="104" y="162" font-size="14" text-anchor="middle" font-weight="700" fill="#16191D">b</text>
    <rect x="124" y="140" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="140" y="162" font-size="14" text-anchor="middle" fill="#16191D">c</text>
  </g>
  <path d="M 122 134 v 44" stroke="#B4402E" stroke-width="2" fill="none"/>
  <text x="166" y="160" font-size="11" fill="#B4402E">anchor pinned to b</text>

  <text x="52" y="204" font-size="11.5" fill="#667085">now type <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">x</tspan> there</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="52"  y="220" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="68"  y="242" font-size="14" text-anchor="middle" fill="#16191D">a</text>
    <rect x="88"  y="220" width="32" height="32" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
    <text x="104" y="242" font-size="14" text-anchor="middle" font-weight="700" fill="#16191D">b</text>
    <rect x="124" y="220" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="140" y="242" font-size="14" text-anchor="middle" fill="#16191D">x</text>
    <rect x="160" y="220" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="176" y="242" font-size="14" text-anchor="middle" fill="#16191D">c</text>
  </g>
  <path d="M 122 214 v 44" stroke="#B4402E" stroke-width="2" fill="none"/>
  <text x="52" y="286" font-size="12.5" font-weight="600" fill="#B4402E">the formatting does NOT grow</text>
  <text x="52" y="304" font-size="11.5" fill="#667085">which is what you want at the end of a link</text>

  <!-- CASE 2 -->
  <rect x="456" y="80" width="392" height="240" rx="6" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="1.2"/>
  <text x="476" y="106" font-size="12.5" font-weight="600" fill="#16191D">end = BEFORE(c)</text>
  <text x="476" y="124" font-size="11.5" fill="#667085">the range ends just <tspan fill="#16191D">before</tspan> the character c</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="476" y="140" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="492" y="162" font-size="14" text-anchor="middle" fill="#16191D">a</text>
    <rect x="512" y="140" width="32" height="32" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
    <text x="528" y="162" font-size="14" text-anchor="middle" font-weight="700" fill="#16191D">b</text>
    <rect x="548" y="140" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="564" y="162" font-size="14" text-anchor="middle" fill="#16191D">c</text>
  </g>
  <path d="M 546 134 v 44" stroke="#1F7A5C" stroke-width="2" fill="none"/>
  <text x="590" y="160" font-size="11" fill="#1F7A5C">anchor pinned to c</text>

  <text x="476" y="204" font-size="11.5" fill="#667085">now type <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#16191D">x</tspan> there</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="476" y="220" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="492" y="242" font-size="14" text-anchor="middle" fill="#16191D">a</text>
    <rect x="512" y="220" width="32" height="32" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
    <text x="528" y="242" font-size="14" text-anchor="middle" font-weight="700" fill="#16191D">b</text>
    <rect x="548" y="220" width="32" height="32" rx="5" fill="#EAF1F9" stroke="#2563A8" stroke-width="1.4"/>
    <text x="564" y="242" font-size="14" text-anchor="middle" font-weight="700" fill="#16191D">x</text>
    <rect x="584" y="220" width="32" height="32" rx="5" fill="#F4F5F7" stroke="#D6DAE0"/>
    <text x="600" y="242" font-size="14" text-anchor="middle" fill="#16191D">c</text>
  </g>
  <path d="M 582 214 v 44" stroke="#1F7A5C" stroke-width="2" fill="none"/>
  <text x="476" y="286" font-size="12.5" font-weight="600" fill="#1F7A5C">the formatting DOES grow</text>
  <text x="476" y="304" font-size="11.5" fill="#667085">which is what you want at the end of bold</text>

  <text x="440" y="344" font-size="12" text-anchor="middle" fill="#667085">One mechanism, one field different. The alternative is a separate “should this expand” flag, detached from where the anchor is.</text>
</svg>
