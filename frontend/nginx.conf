# Serwowanie zbudowanego frontendu. Konfiguracja jest krótka celowo — nginx stoi tu
# wyłącznie po to, żeby oddać pliki statyczne. Ruch do API i WebSocketa idzie z przeglądarki
# WPROST na :8080, a nie przez proxy: dzięki temu konfiguracja odpowiada temu, co widać
# w kodzie klienta (`ws://${window.location.hostname}:8080/ws` w connection.ts), zamiast
# ukrywać adres backendu w warstwie, o której kod nie wie.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bundle Vite ma hash w nazwie pliku, więc jego treść nigdy się nie zmienia pod tym
    # samym adresem — rok cache'owania jest tu bezpieczny i oszczędza pełne pobranie
    # aplikacji przy każdym wejściu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html jest jedynym plikiem BEZ hasza, więc to on decyduje, którą wersję bundla
    # dostanie przeglądarka. Cache'owanie go oznaczałoby, że po wdrożeniu użytkownik
    # dostaje stary index wskazujący na pliki, których już nie ma.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: każda nieznana ścieżka oddaje index.html, bo routing dzieje się po stronie
    # klienta. Bez tego odświeżenie strony na adresie dokumentu daje 404 od nginxa.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
