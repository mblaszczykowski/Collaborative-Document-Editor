# Version catalog — jedno miejsce na wersje zależności.
# Powód: przy dwóch modułach + benchmarkach rozjazd wersji (np. Jackson w crdt-core
# vs Jackson zarządzany przez Spring Boot BOM) jest kwestią czasu, a diagnozuje się
# go źle. Katalog czyni to jawnym.

[versions]
java = "21"
springBoot = "3.5.0"
springDepMgmt = "1.1.7"
jqwik = "1.9.2"
assertj = "3.26.3"
junit = "5.11.4"
jackson = "2.18.2"
testcontainers = "1.20.4"
jmh = "1.37"
jmhPlugin = "0.7.2"
otel = "2.13.3"

[libraries]
# --- crdt-core (rdzeń, zero Springa) ---
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# --- testy ---
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# --- testy integracyjne (CP3) ---
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:toxiproxy", version.ref = "testcontainers" }

# --- JMH (CP2) ---
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

# --- observability (CP7) ---
otel-spring-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "otel" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDepMgmt = { id = "io.spring.dependency-management", version.ref = "springDepMgmt" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
