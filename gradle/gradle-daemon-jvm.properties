# Demon Gradle'a ma działać na JDK 21, niezależnie od tego, co programista ma w PATH.
#
# Powód: na maszynie deweloperskiej domyślnym JDK jest 25-ea, na którym Gradle 8.14
# nie startuje w ogóle (nie potrafi sparsować wersji "25-ea"). Bez tego pliku `./gradlew`
# wymagałby ręcznego ustawiania JAVA_HOME przed każdym poleceniem.
#
# To jest osobna rzecz niż toolchain w build.gradle.kts:
#   - ten plik  → na czym działa SAM Gradle,
#   - toolchain → czym Gradle KOMPILUJE kod.
# Obie muszą być przypięte, żeby build był odtwarzalny.
toolchainVersion=21
