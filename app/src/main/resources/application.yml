spring:
  application:
    name: collabedit

  datasource:
    url: jdbc:postgresql://localhost:55432/collabedit
    username: collabedit
    password: collabedit
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 56379
      timeout: 2000ms

server:
  port: ${COLLABEDIT_PORT:8090}

collabedit:
  websocket:
    heartbeat-interval-ms: 10000
    heartbeat-tolerance-factor: 2.5
    max-message-size-bytes: 65536
    send-buffer-size-bytes: 524288
    send-time-limit-ms: 20000
    broadcast-window-ms: 10
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

  persistence:
    op-batch-window-ms: 50
    op-batch-max-size: 100
    snapshot-every-n-ops: 500
    snapshot-after-idle-ms: 30000
    snapshot-sweep-interval-ms: 1000
    snapshots-kept-per-document: 3
    max-pending-operations: 10000
    max-sync-operations: 5000

  cluster:
    anti-entropy-interval-ms: 30000
    idle-document-eviction-ms: 300000
    idle-document-sweep-ms: 60000
    max-loaded-documents: 200

  gc:
    window-days: 7
    unresponsive-replica-timeout-ms: 60000

  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    app-url: ${COLLABEDIT_APP_URL:http://localhost:5173}
    dev-login-enabled: ${COLLABEDIT_DEV_LOGIN:false}

otel:
  service:
    name: collabedit
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  traces_sampler: always_on

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: collabedit
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    dev.collabedit: DEBUG
