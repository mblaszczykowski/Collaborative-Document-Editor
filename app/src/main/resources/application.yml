spring:
  application:
    name: collabedit

  datasource:
    url: jdbc:postgresql://localhost:55432/collabedit
    username: collabedit
    password: collabedit
    hikari:
      # 10 połączeń na instancję. Uzasadnienie: obciążenie bazy w tym systemie to
      # głównie krótkie, wsadowe INSERT-y operacji (ADR-0003) — nie długie transakcje.
      # Przy takim profilu duża pula nie pomaga, a mnoży kontencję w Postgresie.
      #
      # Zweryfikowane w CP10: przy 50 klientach jednocześnie edytujących jeden dokument
      # pula nie jest wąskim gardłem — przepustowość przyjmowania operacji sięga 116 tys./s,
      # a wszystkie scenariusze harnessu zbiegają się. Wynika to z tego, że zapis jest
      # wsadowany (op-batch-window-ms), więc pod blokadę wiersza wchodzi się raz na wsad,
      # a nie raz na naciśnięcie klawisza. Wartość zostaje.
      #
      # Czego to NIE dowodzi: harness używa jednego dokumentu. Pula jest współdzielona przez
      # wszystkie dokumenty instancji, więc granicą jest liczba jednocześnie ZAPISUJĄCYCH
      # dokumentów, a nie klientów — i tego nie zmierzyłem.
      maximum-pool-size: 10
      minimum-idle: 2
      # Krótszy niż domyślne 30 s. Jeśli nie ma połączenia przez 5 s, to znaczy, że
      # baza jest przeciążona — chcę szybkiego błędu i widocznej metryki, a nie
      # cichego narastania kolejki żądań.
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Brak `clean` na produkcji — zabezpieczenie przed przypadkowym skasowaniem
    # tabeli operations, która jest u nas źródłem prawdy (ADR-0003).
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 56379
      timeout: 2000ms

server:
  port: 8080

# ---------------------------------------------------------------------------
# Parametry WebSocket/STOMP — każda wartość uzasadniona w ADR-0002.
# Nie zmieniać bez aktualizacji tamtego dokumentu.
# ---------------------------------------------------------------------------
collabedit:
  websocket:
    # 10 s: wyraźnie poniżej typowego idle timeout pośredników (nginx 60 s,
    # wiele LB/CDN 30-60 s), więc połączenie nie zostanie zerwane jako bezczynne.
    heartbeat-interval-ms: 10000
    # 2,5 × interwał. Jeden zgubiony heartbeat na łączu mobilnym jest normalny;
    # dopiero dwa z rzędu to przesłanka do uznania sesji za martwą. Fałszywe
    # rozłączenie kosztuje pełną resynchronizację (CP6), więc wolę być zbyt luźny.
    heartbeat-tolerance-factor: 2.5
    # 64 KiB: pojedyncza operacja to ~100 B, ale wklejenie dużego tekstu musi przejść.
    max-message-size-bytes: 65536
    # 512 KiB: wolny klient nie może zablokować broadcastu do reszty. Po przepełnieniu
    # sesja jest zamykana → klient przechodzi ścieżką reconnect+resync (CP6).
    # Kontrolowana degradacja zamiast zatoru na całym dokumencie.
    send-buffer-size-bytes: 524288
    send-time-limit-ms: 20000
    # Okno sklejania rozgłoszeń. Bez niego każde naciśnięcie klawisza to osobna ramka
    # dla KAŻDEGO odbiorcy — przy N klientach liczba ramek rośnie z kwadratem N i przy
    # 50 klientach przepełnia bufor powyżej (metryka ws_sessions_closed_total{reason}).
    #
    # 10 ms, bo to jest poniżej progu, na którym człowiek zauważa opóźnienie w pisaniu
    # (~50-100 ms), a jednocześnie wystarcza, żeby skleić serię znaków wpisywanych
    # w tempie 5-10 na sekundę przez kilku użytkowników naraz. Wartość musi być WYRAŹNIE
    # mniejsza od op-batch-window-ms: potwierdzenie zapisu nie może wyprzedzić rozgłoszenia,
    # bo klient wykrywa luki właśnie po potwierdzeniu operacji, której u siebie nie ma.
    broadcast-window-ms: 10
    # Origins allowed to open the WebSocket. Local only by default.
    #
    # This used to be pinned in WebSocketConfig, which meant a hosted deployment failed at the
    # handshake with no way to fix it short of a rebuild — the browser sends the deployed
    # origin, the server compares it against localhost, and refuses.
    #
    # The default stays restrictive on purpose. An allow-list that defaults to "*" works
    # everywhere, including everywhere it should not — the same mistake TokenService used to
    # make with a signing secret that had a default. A hosted instance sets
    # COLLABEDIT_WEBSOCKET_ALLOWEDORIGINPATTERNS to its own origin.
    #
    # Note that a same-origin deployment (nginx proxying /api and /ws, which is what
    # frontend/nginx.conf.template now does) needs the FRONTEND's origin here, not the
    # backend's — the Origin header describes the page, not the destination.
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

  persistence:
    # Batchowanie zapisu operacji (ADR-0003 pkt 5). W tym oknie operacja jest już
    # rozesłana, ale jeszcze nie w bazie — świadomy kompromis trwałość/przepustowość,
    # opisany w README w sekcji Failure modes.
    op-batch-window-ms: 50
    # Górna granica ROZMIARU wsadu, niezależna od okna czasowego. Zapis trzyma blokadę
    # wiersza dokumentu (OperationStore), więc długość transakcji to długość, przez którą
    # wszyscy inni piszący do tego dokumentu czekają — również z innych instancji.
    # Nadmiar zostaje w buforze i wychodzi w następnym oknie: stały rytm zapisu jest tu
    # lepszy niż jedna wielka transakcja zatrzymująca dokument.
    op-batch-max-size: 100
    # Snapshot po 500 operacjach ALBO po 30 s ciszy (ADR-0003 pkt 4) — dwa progi, bo łapią
    # dwa różne przypadki. Próg operacji obsługuje dokument intensywnie edytowany; próg
    # ciszy obsługuje ten edytowany krótkimi sesjami, który inaczej nigdy nie dobiłby do 500
    # i przy każdym otwarciu odtwarzałby coraz dłuższy ogon logu.
    snapshot-every-n-ops: 500
    snapshot-after-idle-ms: 30000
    # How often the maintenance pool asks "is any document due for a snapshot".
    #
    # Snapshotting moved off the flush loop because that loop shares a thread with the 10 ms
    # broadcast, and a snapshot walks the entire block structure of the document. This job runs
    # on the maintenance pool instead (SchedulingConfig).
    #
    # 1 s, and deliberately far shorter than either threshold it checks (500 ops / 30 s): the
    # sweep only DECIDES whether to snapshot, which is two integer comparisons per loaded
    # replica. A longer interval would make the op-count threshold fire late and save nothing.
    snapshot-sweep-interval-ms: 1000
    # How many snapshots to keep per document; older rows are deleted when a new one is written.
    #
    # Until this existed NOTHING ever removed a snapshot. One is written every 500 operations or
    # after 30 s of quiet, each holding a full compressed copy of the document, so the table grew
    # without bound for the lifetime of the deployment. ADR-0003 calls the snapshot a DISPOSABLE
    # cache — the code had implemented the "cache" half and skipped "disposable". Tombstone GC in
    # memory has its own ADR and its own checkpoint; the cache on disk had no policy at all.
    #
    # 3 rather than 1, because the newest snapshot is not the only one that gets read.
    # HistoryService.textAt asks for the newest snapshot NOT LATER than some past server_seq, so
    # keeping only the head would make every history lookup replay the log from zero. Three keeps
    # recent history cheap and still bounds the table at three copies per document rather than
    # unboundedly many.
    snapshots-kept-per-document: 3

  cluster:
    # Sweep anti-entropy (ADR-0004). Górna granica czasu życia niewykrytego rozjazdu
    # w scenariuszu "zgubiona ostatnia operacja + cisza na dokumencie".
    anti-entropy-interval-ms: 30000
    # Replika dokumentu bez klientów żyje jeszcze 5 min, zanim zwolnimy pamięć.
    # Krócej → ciągłe przeładowywanie przy chwilowych rozłączeniach.
    idle-document-eviction-ms: 300000
    # Górna granica liczby replik w pamięci — granica POJEMNOŚCI, nie czasu.
    #
    # Sam próg bezczynności powyżej nie ogranicza niczego przy wielu dokumentach: sto osób
    # otwierających sto różnych dokumentów w ciągu minuty daje sto replik, z których żadna
    # nie jest bezczynna. Dopiero ta wartość mówi, ile pamięci wolno zająć.
    #
    # 200 wynika z rzędu wielkości, nie z pomiaru: replika dokumentu o 100 tys. znaków
    # zajmuje jednostki megabajtów (bloki run-length + treap), więc 200 mieści się
    # w domyślnej stercie z zapasem na resztę aplikacji. DO ZWERYFIKOWANIA POMIAREM
    # zużycia pamięci na replikę — ADR-0004 wymienia to jako niezrobione od CP8.
    max-loaded-documents: 200

  gc:
    # Okno GC tombstone'ów: 7 dni (ADR-0005). Klient offline dłużej dostaje
    # RESYNC_REQUIRED i eksport lokalnej kopii zamiast cichego scalenia.
    # WARTOŚĆ ZGADNIĘTA, nie wyliczona — w produkcji dobrałbym ją z telemetrii.
    window-days: 7
    # Klient podłączony, ale niepotwierdzający postępu przez 60 s jest wykluczany
    # z liczenia stableVersion, żeby jeden zawieszony klient nie blokował GC
    # całemu dokumentowi. ~2× tolerancja heartbeatu z ADR-0002.
    unresponsive-replica-timeout-ms: 60000

# ---------------------------------------------------------------------------
# Śledzenie rozproszone (CP7). Metryki NIE idą tą drogą — te eksportuje Micrometer
# prosto do Prometheusa. Dwa kanały zamiast jednego, bo Micrometer daje percentyle
# liczone w aplikacji, a metryki OTel wymagałyby liczenia ich z kubełków po stronie
# Prometheusa i traciłyby dokładność dla pojedynczej instancji.
# ---------------------------------------------------------------------------
otel:
  service:
    name: collabedit
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  # Próbkowanie: WSZYSTKO. Przy tej skali trace jest narzędziem diagnostycznym,
  # a nie źródłem kosztów — a próbkowanie 10% sprawiłoby, że interesujący nas przypadek
  # (rzadka rozbieżność, jedna wolna operacja) najczęściej by się nie zapisał.
  # W produkcji przy tysiącach operacji na sekundę: próbkowanie zależne od czasu trwania.
  traces_sampler: always_on

management:
  endpoints:
    web:
      exposure:
        # Tylko to, co faktycznie jest potrzebne. Actuator wystawiony w całości
        # to niepotrzebna powierzchnia ataku nawet lokalnie.
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: collabedit
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    dev.collabedit: DEBUG
