spring:
  application:
    name: collabedit

  datasource:
    url: jdbc:postgresql://localhost:55432/collabedit
    username: collabedit
    password: collabedit
    hikari:
      # 10 connections per instance. The rationale: this system's database load is mostly short,
      # batched operation INSERTs — not long transactions. With that profile a large
      # pool does not help and multiplies contention inside Postgres.
      #
      # Verified in CP10: with 50 clients editing one document simultaneously the pool is not the
      # bottleneck — operation intake throughput reaches 116k/s and every harness scenario
      # converges. That follows from writes being batched (op-batch-window-ms), so the row lock is
      # taken once per batch rather than once per keystroke. The value stays.
      #
      # What that does NOT prove: the harness uses one document. The pool is shared by all of an
      # instance's documents, so the bound is the number of documents being WRITTEN TO
      # simultaneously rather than the number of clients — and I have not measured that.
      maximum-pool-size: 10
      minimum-idle: 2
      # Shorter than the 30 s default. If no connection is available for 5 s the database is
      # overloaded — I want a fast error and a visible metric rather than a request queue
      # silently growing.
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No `clean` in production — a guard against accidentally dropping the operations table,
    # which is our source of truth.
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 56379
      # How long a Redis call may block, and it bounds more than it appears to: the presence
      # announcement and the operation publish are both synchronous, on the maintenance and flow
      # pools. With Redis blackholed — a partition drops SYNs rather than refusing them — this is
      # what each blocked document adds to the pool it runs on. Shorter gives up on a slow but
      # living Redis; longer lets an unreachable one hold the maintenance pool, which is also where
      # anti-entropy runs, i.e. the mechanism that repairs the messages Redis just lost.
      timeout: 2000ms

server:
  # The API port. Overridable, because it is the one setting a person running this alongside
  # something else has to change, and it appears in three places that must agree: the OAuth
  # redirect URI registered with the provider, the frontend's dev fallback, and the compose
  # mapping. 8090 rather than 8080 to stay out of the way of whatever else is already there.
  port: ${COLLABEDIT_PORT:8090}

# ---------------------------------------------------------------------------
# WebSocket/STOMP parameters — every value is justified in the transport decision.
# Do not change one without updating that document.
# ---------------------------------------------------------------------------
collabedit:
  websocket:
    # 10 s: comfortably below intermediaries' typical idle timeout (nginx 60 s, many LBs/CDNs
    # 30-60 s), so the connection will not be torn down as idle.
    heartbeat-interval-ms: 10000
    # 2.5 × the interval — the INTENT, and deliberately kept even though nothing reads it.
    #
    # One lost heartbeat on a mobile link is normal; only two in a row are grounds for treating a
    # session as dead, and a false disconnect costs a full resynchronisation (CP6), so leniency is
    # the right side to err on. But Spring's simple broker has no tolerance factor to configure: it
    # takes the interval and applies its own rule. A computed heartbeatTimeoutMs used to sit in
    # CollabEditProperties deriving a value nothing consumed, which made the transport decision's row read like a
    # setting. That accessor is gone; this value stays as the documented intent, and the transport decision says
    # so in the same words.
    heartbeat-tolerance-factor: 2.5
    # 64 KiB: a single operation is ~100 B, but pasting a large block of text has to get through.
    max-message-size-bytes: 65536
    # 512 KiB: a slow client must not block the broadcast to everyone else. On overflow the
    # session is closed -> the client takes the reconnect+resync path (CP6). Controlled degradation
    # instead of a jam across the whole document.
    send-buffer-size-bytes: 524288
    send-time-limit-ms: 20000
    # The broadcast coalescing window. Without it every keystroke is a separate frame for EVERY
    # recipient — with N clients the frame count grows with N squared, and at 50 clients it
    # overflows the buffer above (the ws_sessions_closed_total{reason} metric).
    #
    # 10 ms, because that is below the threshold at which a person notices typing latency
    # (~50-100 ms) while still being enough to coalesce a run of characters typed at 5-10 per
    # second by several users at once. The value has to be CLEARLY smaller than
    # op-batch-window-ms: a write acknowledgement must not overtake the broadcast, because gap
    # detection on the client works by acknowledging an operation it does not hold.
    broadcast-window-ms: 10
    # Origins allowed to open the WebSocket. Local only by default.
    #
    # This used to be pinned in WebSocketConfig, which meant a hosted deployment failed at the
    # handshake with no way to fix it short of a rebuild — the browser sends the deployed
    # origin, the server compares it against localhost, and refuses.
    #
    # The default stays restrictive on purpose. An allow-list that defaults to "*" works
    # everywhere, including everywhere it should not — the same mistake TokenService used to
    # make with a signing secret that had a default. A hosted instance sets
    # COLLABEDIT_WEBSOCKET_ALLOWEDORIGINPATTERNS to its own origin.
    #
    # Note that a same-origin deployment (nginx proxying /api and /ws, which is what
    # frontend/nginx.conf.template now does) needs the FRONTEND's origin here, not the
    # backend's — the Origin header describes the page, not the destination.
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

  persistence:
    # Batching of operation writes (point 5). Within this window an operation has been
    # broadcast but is not yet in the database — a deliberate durability/throughput trade-off,
    # described in the README's Failure modes section.
    op-batch-window-ms: 50
    # The upper bound on batch SIZE, independent of the time window. A write holds the document's
    # row lock (OperationStore), so the transaction's duration is the duration every other writer
    # to that document waits — including writers on other instances. The excess stays in the buffer
    # and goes out in the next window: a steady write rhythm beats one large transaction stalling
    # the document.
    op-batch-max-size: 100
    # A snapshot after 500 operations OR after 30 s of quiet (point 4) — two thresholds,
    # because they catch two different cases. The operation threshold covers a heavily edited
    # document; the idle threshold covers one edited in short sessions, which would otherwise never
    # reach 500 and would replay an ever-longer log tail on every open.
    snapshot-every-n-ops: 500
    snapshot-after-idle-ms: 30000
    # How often the maintenance pool asks "is any document due for a snapshot".
    #
    # Snapshotting moved off the flush loop because that loop shares a thread with the 10 ms
    # broadcast, and a snapshot walks the entire block structure of the document. This job runs
    # on the maintenance pool instead (SchedulingConfig).
    #
    # 1 s, and deliberately far shorter than either threshold it checks (500 ops / 30 s): the
    # sweep only DECIDES whether to snapshot, which is two integer comparisons per loaded
    # replica. A longer interval would make the op-count threshold fire late and save nothing.
    snapshot-sweep-interval-ms: 1000
    # How many snapshots to keep per document; older rows are deleted when a new one is written.
    #
    # Until this existed NOTHING ever removed a snapshot. One is written every 500 operations or
    # after 30 s of quiet, each holding a full compressed copy of the document, so the table grew
    # without bound for the lifetime of the deployment. The operation-log decision calls the snapshot a DISPOSABLE
    # cache — the code had implemented the "cache" half and skipped "disposable". Tombstone GC in
    # memory has its own design and its own checkpoint; the cache on disk had no policy at all.
    #
    # 3 rather than 1, because the newest snapshot is not the only one that gets read.
    # HistoryService.textAt asks for the newest snapshot NOT LATER than some past server_seq, so
    # keeping only the head would make every history lookup replay the log from zero. Three keeps
    # recent history cheap and still bounds the table at three copies per document rather than
    # unboundedly many.
    snapshots-kept-per-document: 3
    # The upper bound on operations BUFFERED WAITING FOR THEIR CAUSE in one replica.
    #
    # What this protects. RgaDocument buffers an operation whose origin it has not seen yet, and
    # DocumentReplica.merge deliberately writes and broadcasts buffered operations — they are
    # complete, they are simply early (see its comment). Nothing validated that an origin is
    # PLAUSIBLE, so a client sending operations with invented origins grew three things without
    # bound at once: this instance's memory, the operation log, and the pending map of every other
    # client. Worse, every reload of that document then re-applied them and logged "the log may be
    # corrupt" — a permanent false alarm about the one condition that line exists to report.
    #
    # WHY THE BOUND LIVES HERE AND NOT IN crdt-core. Buffering an early operation is correct
    # algorithm behaviour. "How many strangers do we hold for how long" is a POLICY, and
    # policy belongs to the application that has a client, a session and an error channel to answer
    # on. The core keeps the property; this decides how much of it we are willing to pay for.
    #
    # 10 000, chosen to sit far from both edges rather than near either. A legitimate causal
    # reordering backlog is bounded by what one client can have in flight — the rate limiter allows
    # a burst of 200 operations, and a resynchronisation arrives ordered by server_seq — so real
    # traffic stays two orders of magnitude below this. At the other end, 10 000 buffered operations
    # is single-digit megabytes, which is a document's worth of memory rather than an instance's.
    # Reaching it means a client is inventing causality, and the honest answer is to refuse it
    # explicitly (op.rejected.pending.total) rather than to keep swallowing it.
    max-pending-operations: 10000
    # The upper bound on how many operations one resynchronisation response may carry.
    #
    # `sinceServerSeq` comes from the client and was unvalidated, and the query behind it had no
    # LIMIT: every row was decoded into an Op and then re-encoded into JSON, all of it live at once.
    # That is not only an attack surface — the shipped client sends 0 whenever it detects a gap, so
    # a 250k-operation document paid it on the ORDINARY recovery path.
    #
    # Above this the server does NOT truncate silently. It answers SNAPSHOT_REQUIRED, which tells
    # the client to re-open through GET /api/documents/{id}/snapshot — O(document size) instead of
    # O(log size), which is exactly why CP24 built that endpoint. A truncated response that looked
    # complete would be the CP8 failure again: the client that needs the data most is the one that
    # silently does not get it.
    #
    # 5 000 operations is on the order of 500 KB decoded, and roughly ten frames at the 32 KiB
    # budget — a recovery a client can actually complete. Beyond that the snapshot is cheaper for
    # both sides, so the number is where the two costs cross rather than a guess at a safe size.
    max-sync-operations: 5000

  cluster:
    # The anti-entropy sweep. The upper bound on how long an undetected divergence can
    # live in the "lost last operation + quiet document" scenario.
    anti-entropy-interval-ms: 30000
    # A document replica with no clients lives another 5 min before its memory is reclaimed.
    # Shorter -> constant reloading on brief disconnects.
    idle-document-eviction-ms: 300000
    # How often we LOOK for idle replicas. Separate from the threshold above, which this used to
    # double as: a replica going idle just after a pass waited a whole period for the next one, so
    # the real bound was [5, 10) min while every comment about it said 5. At one minute the bound
    # is [5, 6). Not shorter — the pass walks every loaded replica and claims each one's lock, and
    # reclaiming memory from documents nobody has open is not urgent.
    idle-document-sweep-ms: 60000
    # The upper bound on in-memory replicas — a CAPACITY bound, not a time one.
    #
    # The idle threshold above bounds nothing with many documents: a hundred people opening a
    # hundred different documents within a minute gives a hundred replicas, none of them idle. Only
    # this value says how much memory may be occupied.
    #
    # 200 comes from an order-of-magnitude estimate rather than a measurement: the replica of a
    # 100k-character document takes single-digit megabytes (run-length blocks + a treap), so 200
    # fits in the default heap with room for the rest of the application. TO BE VERIFIED BY
    # MEASURING per-replica memory use — the cluster design lists this as outstanding since CP8.
    max-loaded-documents: 200

  gc:
    # The tombstone GC window: 7 days. A client offline for longer gets
    # RESYNC_REQUIRED and an export of its local copy instead of a silent merge.
    # A GUESSED VALUE, not a computed one — in production I would derive it from telemetry.
    window-days: 7
    # A client that is connected but has not reported progress for 60 s is excluded from the
    # stableVersion computation, so that one hung client does not block GC for the whole document.
    #
    # 60 s = 4× the client's progress interval (15 s, connection.ts). Derived from THAT rather than
    # from the heartbeat tolerance, which is what the comment used to say: the tolerance is an
    # intent the broker does not implement (see websocket above), so deriving a real threshold from
    # it was deriving a number from a number that does not exist. Four missed reports in a row is
    # evidence about the client this value is actually about.
    unresponsive-replica-timeout-ms: 60000

# ---------------------------------------------------------------------------
# Distributed tracing (CP7). Metrics do NOT travel this way — those are exported by Micrometer
# straight to Prometheus. Two channels rather than one, because Micrometer gives percentiles
# computed in the application, whereas OTel metrics would require computing them from buckets on
# the Prometheus side and would lose accuracy for a single instance.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Who is allowed in.
#
# Identity is FEDERATED: an OpenID Connect provider vouches for the person, and this application
# never sees a password. The reasoning is in V13__federated_identity.sql — in short, everything this
# system authorises rested on an unverified claim while anybody could type a name and be somebody.
#
# NOTHING IS CONFIGURED BY DEFAULT, deliberately. A provider needs a client id and secret that
# belong to whoever is running this, and there is no sensible placeholder: an application that ships
# with credentials is an application whose credentials are public. Set the environment variables
# below and the buttons appear; leave them and they do not.
#
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   from console.cloud.google.com
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET   from github.com/settings/developers
#
# The redirect URI to register with the provider is
#   http://localhost:8090/login/oauth2/code/google      (and .../github)
# and it must match exactly, port included — which is why the port is one setting rather than three.
  auth:
    # Which buttons the login screen offers. Derived from the registrations below rather than
    # written twice: a screen advertising a provider that is not configured is a redirect loop.
    # The providers are DERIVED from which credentials are present below, not listed separately.
    # Two lists would be one list and a way for it to be wrong: a provider named here but not
    # configured is a button that leads to a redirect loop.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    # Where a finished sign-in sends the browser. The provider redirects to the SERVER and the
    # application lives on another origin, so this is the address the one-time code is handed to.
    # Fixed rather than taken from the request: an open redirect at the end of an authentication
    # flow forwards a freshly minted credential to whoever asked.
    app-url: ${COLLABEDIT_APP_URL:http://localhost:5173}
    # "Type a name, become somebody" — the mechanism federated identity replaced. OFF unless asked
    # for, per process, so that a deployment which does not opt in cannot be signed into by a
    # stranger. Contributors without an OAuth client of their own run with
    # COLLABEDIT_DEV_LOGIN=true.
    dev-login-enabled: ${COLLABEDIT_DEV_LOGIN:false}

otel:
  service:
    name: collabedit
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  # Sampling: EVERYTHING. At this scale a trace is a diagnostic tool rather than a cost centre —
  # and 10% sampling would mean the case we care about (a rare divergence, one slow operation)
  # would usually not be recorded. In production at thousands of operations per second:
  # duration-based sampling.
  traces_sampler: always_on

management:
  endpoints:
    web:
      exposure:
        # Only what is actually needed. Actuator exposed in full is unnecessary attack surface
        # even locally.
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: collabedit
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    dev.collabedit: DEBUG
